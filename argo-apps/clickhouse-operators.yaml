apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-operators
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: "clickhouse-operator"
    server: https://kubernetes.default.svc
  project: default
  sources:
  - repoURL: "ghcr.io/clickhouse"
    chart: "clickhouse-operator-helm"
    targetRevision: "0.0.6"
    helm:
      releaseName: "clickhouse-operator"
      valueFiles:
        - $values/clickhouse-value/operators-values.yaml
  - repoURL: https://github.com/tenex-ai/gcp-tf-infra.git
    targetRevision: clickhouse
    ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true