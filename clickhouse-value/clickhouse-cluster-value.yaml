# https://clickhouse.com/docs/clickhouse-operator/guides/configuration

clickhouse:
  metadata:
    name: clickhouse
  spec:
    externalSecret:
      name: "clickhouse-secrets"
    settings:
      defaultUserPassword:
        secret:
          key: "CLICKHOUSE_PASSWORD"
          name: "clickhouse-secrets"
    replicas: 1
    shards: 1
    keeperClusterRef:
      name: "keeper"
    containerTemplate:
      resources:
        requests:
          memory: "512Mi"
          cpu: "100m"
        limits:
          memory: "1Gi"
          cpu: "500m"
    dataVolumeClaimSpec:
      storageClassName: "standard-rwo"
      accessModes:
      - "ReadWriteOnce"
      resources:
        requests:
          storage: "2Gi"
    podTemplate:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: "topology.kubernetes.io/zone"
        whenUnsatisfiable: "DoNotSchedule"
        labelSelector:
          matchLabels:
            app: "clickhouse"
keeper:
  metadata:
    name: "keeper"
  spec:
    replicas: 1
    clusterDomain: "cluster.local"
    containerTemplate:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "256Mi"
          cpu: "200m"
    dataVolumeClaimSpec:
      storageClassName: "standard-rwo"
      accessModes:
      - "ReadWriteOnce"
      resources:
        requests:
          storage: "1Gi"